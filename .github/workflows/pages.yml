name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'cmd/docsgen/**', 'web/css/**', 'Makefile', 'go.mod', '.github/workflows/pages.yml', '.github/workflows/generated.yml']
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment, but let in-progress production deploys
# finish rather than cancelling them (a cancelled deploy reports as a failed
# check on the superseding commit).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/generated.yml
    permissions:
      contents: read

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
