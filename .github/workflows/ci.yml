name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  generated:
    uses: ./.github/workflows/generated.yml

  docs:
    uses: ./.github/workflows/docs.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.11", "1.27.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer regressions
        run: bash scripts/test-install.sh
      - name: Development watcher regressions
        run: bash scripts/test-dev.sh
      - name: Release tag regressions
        run: bash scripts/test-release-tag.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check agent database independence
        run: bash scripts/test-agent-deps.sh
      - name: Vet
        run: go vet ./...
      - name: Check source vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Retain coverage for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.go-version }}
          path: coverage.out
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.11", "1.27.4"]
    services:
      postgres:
        # Official PostgreSQL 18.6 bookworm, linux/amd64.
        image: postgres@sha256:02fb3245e038f33536cf13bc6c4e59f21d07b0cea3c1fe1c07c6e8aa8f083bcc
        env:
          POSTGRES_USER: asura
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U asura -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ASURA_TEST_POSTGRES_DSN: postgres://asura:fixture-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check optional backend and default dependency boundary
        run: |
          go vet -tags postgres ./...
          go build -tags postgres ./cmd/asura
          bash scripts/test-postgres-deps.sh
      - name: Check optional backend source vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags postgres ./...
      - name: PostgreSQL behavior and failure contracts
        run: |
          : "${ASURA_TEST_POSTGRES_DSN:?PostgreSQL fixture is required}"
          go test -tags postgres -race -count=1 -timeout=5m -coverprofile=postgres-coverage.out ./internal/storage -run '^TestPostgres'
      - name: Retain PostgreSQL coverage for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-postgres-go-${{ matrix.go-version }}
          path: postgres-coverage.out
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          printf '%s\n' "$unformatted"
          test -z "$unformatted"
      - name: Check ineffectual assignments
        run: go run github.com/gordonklaus/ineffassign@v0.1.0 ./...

  build:
    runs-on: ubuntu-latest
    needs: [generated, docs, test, postgres, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build server and agent for both Linux architectures
        run: make release
      - name: Inspect and scan release artifacts
        run: |
          for binary in dist/asura-linux-* dist/asura-agent-linux-*; do
            go version -m "$binary"
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$binary"
          done
