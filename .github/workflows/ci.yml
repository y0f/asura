name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  generated:
    uses: ./.github/workflows/generated.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26.10", "1.27.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer regressions
        run: bash scripts/test-install.sh
      - name: Development watcher regressions
        run: bash scripts/test-dev.sh
      - name: Release tag regressions
        run: bash scripts/test-release-tag.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check agent database independence
        run: bash scripts/test-agent-deps.sh
      - name: Vet
        run: go vet ./...
      - name: Check source vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Retain coverage for review
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-go-${{ matrix.go-version }}
          path: coverage.out
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          printf '%s\n' "$unformatted"
          test -z "$unformatted"
      - name: Check ineffectual assignments
        run: go run github.com/gordonklaus/ineffassign@v0.1.0 ./...

  build:
    runs-on: ubuntu-latest
    needs: [generated, test, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build server and agent for both Linux architectures
        run: make release
      - name: Inspect and scan release artifacts
        run: |
          for binary in dist/asura-linux-* dist/asura-agent-linux-*; do
            go version -m "$binary"
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$binary"
          done
