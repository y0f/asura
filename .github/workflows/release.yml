name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      minor: ${{ steps.tag.outputs.minor }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Build verified release sources
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"
      - name: Attest release binaries and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.tag.outputs.prerelease == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
          files: |
            dist/asura-linux-amd64
            dist/asura-linux-arm64
            dist/asura-agent-linux-amd64
            dist/asura-agent-linux-arm64
            dist/checksums.txt

  docker:
    needs: [tag, validate]
    uses: ./.github/workflows/docker.yml
    with:
      image_tag: ${{ needs.tag.outputs.image_tag }}
      minor: ${{ needs.tag.outputs.minor }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
