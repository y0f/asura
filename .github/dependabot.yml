version: 2
# New releases wait a week before Dependabot proposes them, so a compromised
# or yanked release is usually caught upstream before it reaches this repo.
updates:
  # One PR per Go module: each runtime dependency needs its own license review
  # before licenses/go-modules.json changes (see licenses/README.md).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "docker"
    cooldown:
      default-days: 7
